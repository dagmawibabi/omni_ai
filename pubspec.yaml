name: omni_ai
description: >-
  One easy Flutter API for every AI provider: Vercel AI Gateway, Google Gemini,
  OpenRouter, LM Studio, ElevenLabs, Addis AI and on-device speech. Stream text,
  call tools, build agents with web search, code sandboxes and app
  integrations, generate images, speech and video, and list models.
version: 0.5.0
homepage: https://github.com/dagmawibabi/omni_ai
repository: https://github.com/dagmawibabi/omni_ai
issue_tracker: https://github.com/dagmawibabi/omni_ai/issues
documentation: https://github.com/dagmawibabi/omni_ai#readme
topics:
  - ai
  - llm
  - gemini
  - text-to-speech
  - chatbot

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ">=9.2.0 <12.0.0"
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  record: ^7.0.0
  flutter_svg: ^2.0.0
  webview_flutter: ^4.10.0
  crypto: ^3.0.8
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
